<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>⚡ RamzApp | الدردشات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #222; --surface3: #2a2a2a;
            --text: #fff; --text2: #ddd; --text3: #999; --border: #2c2c2c;
            --accent: #ff0050; --green: #00a884; --online: #00a884; --unread: #ff0050;
            --shadow: 0 8px 32px rgba(0,0,0,0.6); --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .light-theme {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --surface3: #e9edef;
            --text: #111; --text2: #333; --text3: #667781; --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08); --online: #00a884; --unread: #ff0050;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg); font-family: 'Cairo', sans-serif;
            height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            color: var(--text); transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }
        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; }
        .screen { display: none; flex-direction: column; flex: 1; overflow-y: auto; position: absolute; inset: 0; bottom: 70px; background: var(--bg); z-index: 1; transition: opacity 0.2s; }
        .screen.active { display: flex; z-index: 2; }
        .screen.no-nav { bottom: 0; }
        .app-header { background: var(--surface); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 56px; z-index: 20; gap: 8px; position: sticky; top: 0; }
        .app-header h2 { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
        .header-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .header-btn:hover { background: var(--surface3); }
        .header-actions { display: flex; gap: 4px; }
        .search-bar { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; padding: 10px 16px; border-radius: 25px; border: none; background: var(--surface3); color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: all var(--transition); }
        .search-bar input:focus { box-shadow: 0 0 0 3px rgba(255,0,80,0.12); }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: all 0.15s; border-bottom: 1px solid var(--border); }
        .chat-item:hover { background: var(--surface2); }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; position: relative; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 13px; height: 13px; background: var(--online); border-radius: 50%; border: 2px solid var(--surface); }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; }
        .chat-name { font-weight: 600; font-size: 15px; color: var(--text); }
        .chat-time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
        .chat-preview { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
        .last-msg { font-size: 13px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .unread-badge { background: var(--unread); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }

        .contacts-section { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .contacts-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .contact-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.2s; white-space: nowrap; }
        .contact-badge:hover { background: var(--surface3); border-color: var(--accent); }
        .avatar-small { width: 26px; height: 26px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .story-bar { padding: 12px 14px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; display: flex; gap: 12px; background: var(--surface); }
        .story-bar::-webkit-scrollbar { height: 0; }
        .story-item { display: inline-flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; min-width: 65px; transition: 0.2s; }
        .story-ring { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #ff0050, #ff7b00); display: flex; align-items: center; justify-content: center; padding: 3px; }
        .story-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: 700; border: 2px solid var(--bg); color: var(--text); }
        .story-add .story-ring { background: var(--surface3); border: 2px dashed var(--accent); }
        .story-add span { font-size: 28px; color: var(--accent); }
        .story-name { font-size: 10px; color: var(--text3); max-width: 65px; overflow: hidden; text-overflow: ellipsis; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px; }
        .section-header h3 { font-size: 15px; font-weight: 700; }
        .channel-item, .call-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.15s; }
        .channel-item:hover, .call-item:hover { background: var(--surface2); }
        .channel-avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .call-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .item-info { flex: 1; min-width: 0; }
        .item-title { font-weight: 600; font-size: 14px; }
        .item-sub { font-size: 12px; color: var(--text3); }
        .tools-grid { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .stat-card { background: var(--surface); border-radius: 18px; padding: 18px; border: 1px solid var(--border); }
        .stat-row { display: flex; gap: 10px; }
        .stat-box { flex: 1; text-align: center; background: #0f0f0f; border-radius: 12px; padding: 14px 8px; }
        .stat-num { font-size: 28px; font-weight: 900; }
        .stat-label { font-size: 11px; color: var(--text3); }
        .promo-card { background: linear-gradient(135deg, #ff0050, #ff7b00); border-radius: 18px; padding: 20px; color: #fff; }
        .promo-btn { background: #fff; color: #ff0050; border: none; border-radius: 25px; padding: 10px 20px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .tool-row { background: var(--surface); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .tool-row:hover { border-color: var(--accent); }
        .tool-icon { width: 44px; height: 44px; background: var(--surface3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tool-info { flex: 1; }
        .tool-name { font-weight: 700; font-size: 14px; }
        .tool-desc { font-size: 11px; color: var(--text3); }
        .profile-section { text-align: center; padding: 30px 20px; }
        .profile-avatar-lg { width: 100px; height: 100px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 800; margin: 0 auto 14px; border: 3px solid var(--accent); }
        .profile-name-lg { font-size: 24px; font-weight: 800; }
        .profile-bio-lg { color: var(--text3); margin: 6px 0 16px; }
        .settings-list { padding: 16px; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--surface); border-radius: 14px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; border: 1px solid var(--border); }
        .setting-item:hover { background: var(--surface2); }
        .setting-left { display: flex; align-items: center; gap: 12px; }
        .setting-icon { width: 38px; height: 38px; background: var(--surface3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .toggle-sw { width: 48px; height: 26px; background: var(--border); border-radius: 13px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle-sw.active { background: var(--accent); }
        .toggle-sw::after { content: ''; position: absolute; width: 22px; height: 22px; background: #fff; border-radius: 50%; top: 2px; right: 2px; transition: 0.3s; }
        .toggle-sw.active::after { right: 24px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); display: flex; justify-content: space-around; padding: 6px 0 10px; border-top: 1px solid var(--border); z-index: 100; max-width: 600px; margin: 0 auto; }
        .nav-item { background: none; border: none; color: var(--text3); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-family: inherit; padding: 4px 8px; border-radius: 12px; transition: 0.2s; font-size: 10px; font-weight: 600; min-width: 55px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--accent); }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 13px; z-index: 5000; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); font-family: inherit; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- شاشات التطبيق: الدردشات، جهات الاتصال، المكالمات، التحديثات، الأدوات، الإعدادات -->
        <div class="screen active" id="chatsScreen">
            <div class="app-header">
                <button class="header-btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
                <h2>💬 RamzApp</h2>
                <div class="header-actions">
                    <button class="header-btn" id="contactsBtn"><i class="fas fa-address-book"></i></button>
                    <button class="header-btn" id="searchBtn"><i class="fas fa-search"></i></button>
                    <button class="header-btn" id="mainMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
                </div>
            </div>
            <div class="search-bar"><input type="text" id="searchChatsInput" placeholder="🔍 بحث..."></div>
            <div class="chats-list" id="chatsList"></div>
        </div>
        <!-- باقي الشاشات اختصارًا (جهات الاتصال، المكالمات...) نفس الهيكل السابق -->
    </div>

    <div class="toast" id="toast"></div>
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-nav="chats"><i class="fas fa-comment-dots"></i><span>الدردشات</span></button>
        <button class="nav-item" data-nav="contacts"><i class="fas fa-address-book"></i><span>جهات الاتصال</span></button>
        <button class="nav-item" data-nav="calls"><i class="fas fa-phone"></i><span>المكالمات</span></button>
        <button class="nav-item" data-nav="updates"><i class="fas fa-sync-alt"></i><span>التحديثات</span></button>
        <button class="nav-item" data-nav="tools"><i class="fas fa-tools"></i><span>الأدوات</span></button>
    </div>

    <script>
        // ========== 1. استعادة المستخدم من localStorage (مضمونة) ==========
        const savedUser = localStorage.getItem('ramz_user');
        if (!savedUser) {
            window.location.href = 'login.html';
        }
        let currentUser = JSON.parse(savedUser);
        console.log('👤 المستخدم الحالي:', currentUser.name);

        // ========== 2. دوال مساعدة ==========
        function toast(msg, dur=2000) {
            const t = document.getElementById('toast'); if (!t) return;
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), dur);
        }
        function esc(str) { return str ? str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]) : ''; }
        function genId() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,6); }
        function fmtTime(d) { return new Date(d).toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' }); }
        function timeAgo(d) {
            const diff = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
            if (diff < 60) return 'الآن';
            if (diff < 3600) return Math.floor(diff / 60) + ' د';
            if (diff < 86400) return Math.floor(diff / 3600) + ' س';
            return Math.floor(diff / 86400) + ' يوم';
        }

        // ========== 3. بيانات تجريبية (داخل localStorage) ==========
        const DB_KEY = 'ramzapp_demo_data';
        let DB = {
            chats: [],
            messages: {},
            theme: 'dark',
            notifications: true
        };

        function loadDB() {
            const raw = localStorage.getItem(DB_KEY);
            if (raw) try { DB = { ...DB, ...JSON.parse(raw) }; } catch (e) {}
            if (!DB.chats.length) seedData();
        }

        function seedData() {
            const contacts = [
                { id: 'c1', name: 'ترف مرسل', lastSeen: 'الآن', online: true, avatar: 'ت', unread: 2, pinned: true },
                { id: 'c2', name: 'زينة مستقبل', lastSeen: '10:30', online: false, avatar: 'ز', unread: 0 },
                { id: 'c3', name: 'شعلان مرسل', lastSeen: 'أمس', online: false, avatar: 'ش', unread: 5, pinned: true },
                { id: 'c4', name: 'رمزي مستقبل', lastSeen: 'الآن', online: true, avatar: 'ر', unread: 1 },
            ];
            contacts.forEach(c => {
                DB.chats.push({ ...c, lastMsg: '', lastTime: new Date().toISOString() });
                DB.messages[c.id] = [];
            });
            DB.messages['c1'] = [
                { id: 'm1', sid: 'c1', text: 'مرحباً! كيف حالك؟', time: new Date(Date.now()-7200000).toISOString() },
                { id: 'm2', sid: 'me', text: 'الحمد لله، بخير. وأنت؟', time: new Date(Date.now()-3600000).toISOString() },
            ];
            DB.chats[0].lastMsg = 'الحمد لله، بخير. وأنت؟';
            DB.messages['c3'] = [
                { id: 'm4', sid: 'c3', text: 'هل أنهيت الكود الجديد؟', time: new Date(Date.now()-14400000).toISOString() },
            ];
            DB.chats[2].lastMsg = 'هل أنهيت الكود الجديد؟';
            localStorage.setItem(DB_KEY, JSON.stringify(DB));
        }

        function renderChats(filter='') {
            const container = document.getElementById('chatsList');
            let chats = [...DB.chats].sort((a,b)=>(b.pinned-a.pinned)||(new Date(b.lastTime)-new Date(a.lastTime)));
            if (filter) chats = chats.filter(c => c.name.includes(filter));
            container.innerHTML = chats.length ? '' : '<div class="empty-state"><i class="fas fa-comments"></i><p>لا توجد محادثات</p></div>';
            chats.forEach(c => {
                const div = document.createElement('div'); div.className = 'chat-item';
                div.innerHTML = `<div class="chat-avatar">${c.avatar}${c.online?'<span class="online-dot"></span>':''}</div><div class="chat-info"><div class="chat-name-row"><span class="chat-name">${c.pinned?'📌 ':''}${esc(c.name)}</span><span class="chat-time">${timeAgo(c.lastTime)}</span></div><div class="chat-preview"><span class="last-msg">${c.lastMsg?esc(c.lastMsg.substring(0,35)):'👋 ابدأ المحادثة'}</span>${c.unread>0?`<span class="unread-badge">${c.unread}</span>`:''}</div></div>`;
                div.addEventListener('click', () => alert('فتح محادثة مع ' + c.name)); // لاحقاً: location.href = 'chat.html?...'
                container.appendChild(div);
            });
        }

        // ========== 4. بدء التطبيق ==========
        loadDB();
        renderChats();

        // أزرار التنقل
        document.getElementById('searchBtn').addEventListener('click', () => document.getElementById('searchChatsInput').focus());
        document.getElementById('mainMenuBtn').addEventListener('click', () => {
            toast('قائمة قريباً');
        });
        document.getElementById('settingsBtn').addEventListener('click', () => {
            toast('الإعدادات قريباً');
        });
    </script>
</body>
</html>
