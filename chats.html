<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ RamzApp | الدردشات</title>
    <!-- FontAwesome - نظام تحميل متعدد الطبقات -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://use.fontawesome.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" id="fa-main">
    <script>
        (function() {
            function isFontAwesomeLoaded() {
                var testIcon = document.createElement('i');
                testIcon.className = 'fas fa-home';
                testIcon.style.position = 'absolute';
                testIcon.style.visibility = 'hidden';
                document.body.appendChild(testIcon);
                var computed = window.getComputedStyle(testIcon, ':before');
                var content = computed.getPropertyValue('content');
                document.body.removeChild(testIcon);
                return (content && content !== 'none' && content !== '');
            }
            setTimeout(function() {
                if (!isFontAwesomeLoaded()) {
                    var fallbackLink = document.createElement('link');
                    fallbackLink.rel = 'stylesheet';
                    fallbackLink.href = 'https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css';
                    fallbackLink.id = 'fa-fallback';
                    document.head.appendChild(fallbackLink);
                    setTimeout(function() {
                        if (!isFontAwesomeLoaded()) {
                            document.body.classList.add('no-fa');
                            console.warn('FontAwesome لم يتم تحميله، سيتم استخدام أيقونات نصية بديلة');
                        }
                    }, 1500);
                }
            }, 1000);
        })();
    </script>
    <style>
        /* أنماط احتياطية للأيقونات عند فشل FontAwesome */
        .no-fa .fas, .no-fa .far, .no-fa .fab {
            font-family: monospace;
            font-style: normal;
            font-weight: normal;
        }
        .no-fa .fas.fa-comment-dots:before { content: "💬"; }
        .no-fa .fas.fa-address-book:before { content: "📇"; }
        .no-fa .fas.fa-phone:before { content: "📞"; }
        .no-fa .fas.fa-sync-alt:before { content: "🔄"; }
        .no-fa .fas.fa-tools:before { content: "🛠️"; }
        .no-fa .fas.fa-cog:before { content: "⚙️"; }
        .no-fa .fas.fa-search:before { content: "🔍"; }
        .no-fa .fas.fa-ellipsis-v:before { content: "⋮"; }
        .no-fa .fas.fa-arrow-right:before { content: "←"; }
        .no-fa .fas.fa-plus:before { content: "+"; }
        .no-fa .fas.fa-boxes:before { content: "📦"; }
        .no-fa .fas.fa-bullhorn:before { content: "📣"; }
        .no-fa .fas.fa-moon:before { content: "🌙"; }
        .no-fa .fas.fa-sign-out-alt:before { content: "🚪"; }
        .no-fa .fas.fa-chevron-left:before { content: "←"; }

        :root {
            --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #222; --surface3: #2a2a2a;
            --text: #fff; --text2: #ddd; --text3: #999; --border: #2c2c2c;
            --accent: #ff0050; --green: #00a884; --online: #00a884; --unread: #ff0050;
            --shadow: 0 8px 32px rgba(0,0,0,0.6); --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .light-theme {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --surface3: #e9edef;
            --text: #111; --text2: #333; --text3: #667781; --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08); --online: #00a884; --unread: #ff0050;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg); font-family: 'Cairo', sans-serif;
            height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            color: var(--text); transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
        }

        .app-container { display: flex; flex-direction: column; height: 100%; position: relative; }
        .screen { display: none; flex-direction: column; flex: 1; overflow-y: auto; position: absolute; inset: 0; bottom: 70px; background: var(--bg); z-index: 1; transition: opacity 0.2s; }
        .screen.active { display: flex; z-index: 2; }
        .screen.no-nav { bottom: 0; }
        .app-header { background: var(--surface); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); min-height: 56px; z-index: 20; gap: 8px; position: sticky; top: 0; }
        .app-header h2 { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
        .header-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .header-btn:hover { background: var(--surface3); }
        .header-actions { display: flex; gap: 4px; }
        .search-bar { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .search-bar input { width: 100%; padding: 10px 16px; border-radius: 25px; border: none; background: var(--surface3); color: var(--text); font-family: inherit; font-size: 14px; outline: none; }
        .search-bar input:focus { box-shadow: 0 0 0 3px rgba(255,0,80,0.12); }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; transition: all 0.15s; border-bottom: 1px solid var(--border); }
        .chat-item:hover { background: var(--surface2); }
        .chat-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; position: relative; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 13px; height: 13px; background: var(--online); border-radius: 50%; border: 2px solid var(--surface); }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name-row { display: flex; justify-content: space-between; align-items: center; }
        .chat-name { font-weight: 600; font-size: 15px; color: var(--text); }
        .chat-time { font-size: 11px; color: var(--text3); flex-shrink: 0; }
        .chat-preview { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
        .last-msg { font-size: 13px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .unread-badge { background: var(--unread); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }
        .contacts-section, .channels-section, .calls-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .section-title { font-weight: 700; margin-bottom: 8px; font-size: 14px; color: var(--text3); }
        .contact-item, .channel-item, .call-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; cursor: pointer; border-bottom: 1px solid var(--border); }
        .contact-avatar, .channel-avatar, .call-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; }
        .item-detail { font-size: 11px; color: var(--text3); }
        .invite-btn { background: var(--accent); color: #fff; border: none; padding: 4px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; }
        .tools-grid { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .tool-row { background: var(--surface); padding: 12px; border-radius: 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid var(--border); }
        .tool-row i { font-size: 20px; width: 28px; }
        .settings-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .setting-item { background: var(--surface); padding: 12px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1px solid var(--border); }
        .setting-item i { margin-left: 12px; }
        .toggle-sw { width: 44px; height: 24px; background: var(--border); border-radius: 12px; position: relative; transition: 0.2s; cursor: pointer; }
        .toggle-sw.active { background: var(--accent); }
        .toggle-sw::after { content: ''; position: absolute; width: 20px; height: 20px; background: #fff; border-radius: 50%; top: 2px; right: 2px; transition: 0.2s; }
        .toggle-sw.active::after { right: 22px; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 13px; z-index: 5000; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); }
        .toast.show { opacity: 1; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); display: flex; justify-content: space-around; padding: 6px 0 10px; border-top: 1px solid var(--border); z-index: 100; max-width: 600px; margin: 0 auto; }
        .nav-item { background: none; border: none; color: var(--text3); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-family: inherit; padding: 4px 8px; border-radius: 12px; transition: 0.2s; font-size: 10px; font-weight: 600; min-width: 55px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--accent); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-container" id="appContainer">
    <!-- شاشة الدردشات -->
    <div class="screen active" id="chatsScreen">
        <div class="app-header">
            <button class="header-btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
            <h2>💬 RamzApp</h2>
            <div class="header-actions">
                <button class="header-btn" id="contactsBtn"><i class="fas fa-address-book"></i></button>
                <button class="header-btn" id="searchBtn"><i class="fas fa-search"></i></button>
                <button class="header-btn" id="mainMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>
        <div class="search-bar"><input type="text" id="searchChatsInput" placeholder="🔍 بحث في المحادثات..."></div>
        <div class="chats-list" id="chatsList"></div>
    </div>
    <!-- شاشة جهات الاتصال -->
    <div class="screen" id="contactsScreen">
        <div class="app-header">
            <button class="header-btn" id="backFromContactsBtn"><i class="fas fa-arrow-right"></i></button>
            <h2>📇 جهات الاتصال</h2>
            <button class="header-btn" id="addContactBtn"><i class="fas fa-plus"></i></button>
        </div>
        <div id="contactsList" style="flex:1;overflow-y:auto;"></div>
    </div>
    <!-- شاشة المكالمات -->
    <div class="screen" id="callsScreen">
        <div class="app-header"><h2>📞 المكالمات</h2></div>
        <div id="callsList" class="chats-list"></div>
    </div>
    <!-- شاشة التحديثات -->
    <div class="screen" id="updatesScreen">
        <div class="app-header"><h2>🔄 التحديثات</h2></div>
        <div id="storiesList" class="contacts-section"></div>
        <div id="channelsList" class="contacts-section"></div>
    </div>
    <!-- شاشة الأدوات -->
    <div class="screen" id="toolsScreen">
        <div class="app-header"><h2>🛠 الأدوات</h2></div>
        <div class="tools-grid">
            <div class="tool-row" id="catalogBtn"><i class="fas fa-boxes"></i> الكتالوج</div>
            <div class="tool-row" id="broadcastBtn"><i class="fas fa-bullhorn"></i> الرسائل الجماعية</div>
        </div>
    </div>
    <!-- شاشة الإعدادات -->
    <div class="screen no-nav" id="settingsScreen">
        <div class="app-header">
            <button class="header-btn" id="closeSettingsBtn"><i class="fas fa-arrow-right"></i></button>
            <h2>⚙️ الإعدادات</h2>
        </div>
        <div class="settings-list">
            <div class="setting-item" id="themeToggle"><div><i class="fas fa-moon"></i> الوضع الليلي</div><div class="toggle-sw" id="themeSwitch"></div></div>
            <div class="setting-item" id="logoutBtn"><div><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</div><i class="fas fa-chevron-left"></i></div>
        </div>
    </div>
</div>
<div class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-nav="chats"><i class="fas fa-comment-dots"></i><span>الدردشات</span></button>
    <button class="nav-item" data-nav="contacts"><i class="fas fa-address-book"></i><span>جهات الاتصال</span></button>
    <button class="nav-item" data-nav="calls"><i class="fas fa-phone"></i><span>المكالمات</span></button>
    <button class="nav-item" data-nav="updates"><i class="fas fa-sync-alt"></i><span>التحديثات</span></button>
    <button class="nav-item" data-nav="tools"><i class="fas fa-tools"></i><span>الأدوات</span></button>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/sqlite-local.js"></script>
<script src="js/common.js"></script>

<script>
    (function() {
        let currentUser = null;
        let socket = null;
        const SERVER_URL = 'https://ramzapp.onrender.com';

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }

        function timeAgo(dateStr) {
            if (!dateStr) return '';
            const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
            if (diff < 60) return 'الآن';
            if (diff < 3600) return Math.floor(diff / 60) + ' د';
            if (diff < 86400) return Math.floor(diff / 3600) + ' س';
            return Math.floor(diff / 86400) + ' يوم';
        }

        async function getSessionUser() {
            try {
                const user = await RamzDB.getUser();
                if (user && user.id) return user;
            } catch(e) {}
            window.location.href = 'login.html';
            return null;
        }

        async function connectToServer() {
            return new Promise((resolve, reject) => {
                socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
                socket.on('connect', () => {
                    socket.emit('login', { username: currentUser.name }, (response) => {
                        if (response && response.error) reject(response.error);
                        else {
                            if (response?.user?.id) currentUser.id = response.user.id;
                            resolve();
                        }
                    });
                });
                socket.on('connect_error', reject);
            });
        }

        async function loadChats(filter = '') {
            const chats = await RamzDB.getAllChats();
            const container = document.getElementById('chatsList');
            if (!chats.length) {
                container.innerHTML = '<div class="empty-state">لا توجد محادثات بعد، ابدأ محادثة جديدة</div>';
                return;
            }
            container.innerHTML = '';
            chats.sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));
            for (const chat of chats) {
                if (filter && !chat.chatId.includes(filter)) continue;
                const messages = await RamzDB.getMessages(chat.chatId);
                const lastMsg = messages.length ? messages[messages.length-1] : null;
                const lastText = lastMsg ? (lastMsg.text || '📎 مرفق') : '';
                const lastTime = lastMsg ? lastMsg.timestamp : chat.lastTime;
                const unread = chat.unread || 0;
                const contactName = chat.chatId;
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <div class="chat-avatar">${escapeHtml(contactName.charAt(0))}</div>
                    <div class="chat-info">
                        <div class="chat-name-row"><span class="chat-name">${escapeHtml(contactName)}</span><span class="chat-time">${timeAgo(lastTime)}</span></div>
                        <div class="chat-preview"><span class="last-msg">${escapeHtml(lastText.substring(0,35))}</span>${unread>0?`<span class="unread-badge">${unread}</span>`:''}</div>
                    </div>
                `;
                div.addEventListener('click', () => {
                    window.location.href = `chat.html?chatId=${encodeURIComponent(chat.chatId)}&name=${encodeURIComponent(contactName)}`;
                });
                container.appendChild(div);
            }
        }

        async function loadContacts() {
            const contacts = await RamzDB.getAllContacts();
            const container = document.getElementById('contactsList');
            if (!contacts.length) {
                container.innerHTML = '<div class="empty-state">لا توجد جهات اتصال. يمكنك إضافتها من خلال زر +</div>';
                return;
            }
            container.innerHTML = '';
            for (const c of contacts) {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.innerHTML = `
                    <div class="contact-avatar">${escapeHtml(c.name.charAt(0))}</div>
                    <div class="item-info"><div class="item-name">${escapeHtml(c.name)}</div><div class="item-detail">${escapeHtml(c.phone)}</div></div>
                    <button class="invite-btn" data-phone="${c.phone}" data-name="${c.name}">${c.registered ? 'مراسلة' : 'دعوة'}</button>
                `;
                const btn = div.querySelector('.invite-btn');
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (c.registered) {
                        window.location.href = `chat.html?chatId=${encodeURIComponent(c.phone)}&name=${encodeURIComponent(c.name)}`;
                    } else {
                        toast(`دعوة ${c.name} عبر الرسائل القصيرة`);
                        window.open(`sms:${c.phone}?body=انضم إلى RamzApp`, '_blank');
                    }
                });
                container.appendChild(div);
            }
        }

        async function addContact() {
            const phone = prompt('أدخل رقم الهاتف:');
            if (!phone) return;
            const name = prompt('أدخل الاسم:');
            if (!name) return;
            await RamzDB.addContact(phone, name);
            toast('✅ تمت إضافة جهة الاتصال');
            loadContacts();
        }

        async function loadCalls() {
            document.getElementById('callsList').innerHTML = '<div class="empty-state">لا توجد مكالمات مسجلة</div>';
        }

        async function loadUpdates() {
            document.getElementById('storiesList').innerHTML = '<div class="section-title">📖 القصص</div><div class="contact-item">➕ أضف قصة جديدة</div>';
            document.getElementById('channelsList').innerHTML = '<div class="section-title">📢 القنوات</div><div class="contact-item">🔹 قناة تقنية</div><div class="contact-item">⚽ قناة رياضة</div>';
        }

        function setupTools() {
            document.getElementById('catalogBtn').onclick = () => toast('📦 الكتالوج قريباً');
            document.getElementById('broadcastBtn').onclick = () => toast('📣 الرسائل الجماعية قريباً');
        }

        async function setupSettings() {
            const themeSwitch = document.getElementById('themeSwitch');
            const currentTheme = await RamzDB.getSetting('theme');
            const isDark = currentTheme !== 'light';
            themeSwitch.classList.toggle('active', isDark);
            themeSwitch.onclick = async () => {
                const newTheme = document.body.classList.contains('light-theme') ? 'dark' : 'light';
                document.body.classList.toggle('light-theme');
                themeSwitch.classList.toggle('active', newTheme !== 'light');
                await RamzDB.setSetting('theme', newTheme);
            };
            document.getElementById('logoutBtn').onclick = async () => {
                await RamzDB.deleteUser();
                await RamzDB.deleteAllData();
                window.location.href = 'login.html';
            };
            document.getElementById('closeSettingsBtn').onclick = () => showScreen('chats');
        }

        const screens = ['chatsScreen', 'contactsScreen', 'callsScreen', 'updatesScreen', 'toolsScreen', 'settingsScreen'];
        async function showScreen(id) {
            screens.forEach(s => document.getElementById(s).classList.remove('active'));
            document.getElementById(id + 'Screen').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.nav === id));
            if (id === 'chats') await loadChats();
            if (id === 'contacts') await loadContacts();
            if (id === 'calls') await loadCalls();
            if (id === 'updates') await loadUpdates();
            if (id === 'tools') setupTools();
            if (id === 'settings') await setupSettings();
        }

        document.getElementById('searchChatsInput').addEventListener('input', (e) => loadChats(e.target.value));
        document.getElementById('settingsBtn').onclick = () => showScreen('settings');
        document.getElementById('contactsBtn').onclick = () => showScreen('contacts');
        document.getElementById('searchBtn').onclick = () => document.getElementById('searchChatsInput').focus();
        document.getElementById('backFromContactsBtn').onclick = () => showScreen('chats');
        document.getElementById('addContactBtn').onclick = addContact;
        document.getElementById('mainMenuBtn').onclick = () => toast('القائمة الرئيسية');
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.onclick = () => showScreen(btn.dataset.nav);
        });

        async function applySavedTheme() {
            const theme = await RamzDB.getSetting('theme');
            if (theme === 'light') document.body.classList.add('light-theme');
        }

        async function init() {
            if (typeof RamzDB === 'undefined') {
                setTimeout(init, 500);
                return;
            }
            await RamzDB.openDatabase();
            currentUser = await getSessionUser();
            if (!currentUser) return;
            await applySavedTheme();
            try {
                await connectToServer();
                console.log('✅ متصل بخادم RamzApp');
            } catch(e) { console.warn(e); }
            await showScreen('chats');
        }
        init();
    })();
</script>
</body>
</html>
