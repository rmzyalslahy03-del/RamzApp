<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>💬 RamzApp | المحادثة</title>
    <!-- الخط -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome - نظام تحميل متعدد الطبقات لضمان الظهور -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://use.fontawesome.com">
    <!-- المحاولة الأولى (CDN الرئيسي) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" id="fa-main">
    <script>
        (function() {
            // دالة للتحقق من ظهور الأيقونات
            function isFontAwesomeLoaded() {
                var testIcon = document.createElement('i');
                testIcon.className = 'fas fa-home';
                testIcon.style.position = 'absolute';
                testIcon.style.visibility = 'hidden';
                document.body.appendChild(testIcon);
                var computed = window.getComputedStyle(testIcon, ':before');
                var content = computed.getPropertyValue('content');
                document.body.removeChild(testIcon);
                return (content && content !== 'none' && content !== '');
            }
            
            // إذا فشل التحميل بعد 1 ثانية، حاول تحميل CDN بديل
            setTimeout(function() {
                if (!isFontAwesomeLoaded()) {
                    var fallbackLink = document.createElement('link');
                    fallbackLink.rel = 'stylesheet';
                    fallbackLink.href = 'https://use.fontawesome.com/releases/v6.0.0-beta3/css/all.css';
                    fallbackLink.id = 'fa-fallback';
                    document.head.appendChild(fallbackLink);
                    
                    // إذا فشل البديل أيضاً بعد 1.5 ثانية، أضف class للبديل النصي
                    setTimeout(function() {
                        if (!isFontAwesomeLoaded()) {
                            document.body.classList.add('no-fa');
                            console.warn('FontAwesome لم يتم تحميله، سيتم استخدام أيقونات نصية بديلة');
                        }
                    }, 1500);
                }
            }, 1000);
        })();
    </script>
    
    <style>
        /* أنماط احتياطية عندما لا يتم تحميل FontAwesome */
        .no-fa .fas, .no-fa .far, .no-fa .fab {
            font-family: monospace;
            font-style: normal;
            font-weight: normal;
        }
        .no-fa .fas.fa-arrow-right:before { content: "←"; }
        .no-fa .fas.fa-phone:before { content: "📞"; }
        .no-fa .fas.fa-video:before { content: "📹"; }
        .no-fa .fas.fa-ellipsis-v:before { content: "⋮"; }
        .no-fa .fas.fa-cog:before { content: "⚙️"; }
        .no-fa .fas.fa-address-book:before { content: "📇"; }
        .no-fa .fas.fa-search:before { content: "🔍"; }
        .no-fa .fas.fa-paper-plane:before { content: "➤"; }
        .no-fa .fas.fa-microphone:before { content: "🎙️"; }
        .no-fa .fas.fa-paperclip:before { content: "📎"; }
        .no-fa .far.fa-smile-wink:before { content: "😊"; }
        .no-fa .fas.fa-reply:before { content: "↩️"; }
        .no-fa .fas.fa-play:before { content: "▶️"; }
        .no-fa .fas.fa-pause:before { content: "⏸️"; }
        .no-fa .fas.fa-check:before { content: "✔"; }
        .no-fa .fas.fa-check-double:before { content: "✔✔"; }
        .no-fa .fas.fa-trash-alt:before { content: "🗑️"; }
        .no-fa .fas.fa-boxes:before { content: "📦"; }
        .no-fa .fas.fa-bullhorn:before { content: "📣"; }
        .no-fa .fas.fa-moon:before { content: "🌙"; }
        .no-fa .fas.fa-sign-out-alt:before { content: "🚪"; }
        .no-fa .fas.fa-chevron-left:before { content: "←"; }
        .no-fa .fas.fa-comment-dots:before { content: "💬"; }
        .no-fa .fas.fa-sync-alt:before { content: "🔄"; }
        .no-fa .fas.fa-tools:before { content: "🛠️"; }

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222;
            --surface3: #2a2a2a;
            --text: #fff;
            --text2: #ddd;
            --text3: #999;
            --border: #2c2c2c;
            --accent: #ff0050;
            --green: #00a884;
            --online: #00a884;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .light-theme {
            --bg: #f0f2f5; --surface: #fff; --surface2: #f5f5f5; --surface3: #e9edef;
            --text: #111; --text2: #333; --text3: #667781; --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08); --online: #00a884;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg); font-family: 'Cairo', sans-serif;
            height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            color: var(--text); transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }

        .chat-header-bar {
            background: var(--surface); padding: 8px 12px; display: flex; align-items: center;
            gap: 10px; border-bottom: 1px solid var(--border); min-height: 56px;
        }
        .header-btn {
            background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; transition: all 0.2s; flex-shrink: 0;
        }
        .header-btn:hover { background: var(--surface3); }
        .header-actions { display: flex; gap: 4px; }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%; background: var(--surface3);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            font-weight: 700; cursor: pointer; flex-shrink: 0;
        }
        .chat-header-info { flex: 1; cursor: pointer; min-width: 0; }
        .chat-header-name { font-weight: 700; font-size: 15px; }
        .chat-header-status { font-size: 11px; color: var(--text3); }
        .chat-header-status.online { color: var(--online); }
        .chat-header-status.typing { color: var(--green); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }

        .messages-area {
            flex: 1; overflow-y: auto; padding: 10px 8px; display: flex; flex-direction: column;
            gap: 6px; background: var(--bg);
            background-image: radial-gradient(circle at center, var(--border) 1px, transparent 1px);
            background-size: 32px 32px; scroll-behavior: smooth;
        }
        .msg-row { display: flex; width: 100%; animation: fadeUp 0.3s ease; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .msg-row.own { justify-content: flex-end; }
        .msg-bubble {
            max-width: 84%; padding: 8px 12px; border-radius: 16px; font-size: 13.5px;
            line-height: 1.5; position: relative; word-break: break-word; cursor: default;
        }
        .own .msg-bubble { background: #005c4b; color: #e9ffef; border-bottom-left-radius: 4px; }
        .light-theme .own .msg-bubble { background: #d9fdd3; color: #111; }
        .other .msg-bubble { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
        .attachment-img { max-width: 200px; max-height: 200px; border-radius: 10px; margin-top: 4px; cursor: pointer; transition: transform 0.2s; }
        .voice-msg { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
        .voice-play-btn {
            background: var(--accent); border: none; color: #fff; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 13px; transition: 0.2s;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        }
        .voice-wave { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; }
        .voice-wave-bar { width: 3px; background: var(--accent); border-radius: 2px; animation: waveAnim 0.6s ease-in-out infinite alternate; }
        .msg-time-row { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; font-size: 10px; color: var(--text3); }

        .reply-bar { background: var(--surface); padding: 8px 14px; font-size: 12px; border-top: 1px solid var(--border); display: none; align-items: center; justify-content: space-between; gap: 8px; }
        .input-bar { background: var(--surface); padding: 8px 10px; display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--border); }
        .input-bar input { flex: 1; background: var(--surface3); border: none; border-radius: 25px; padding: 10px 16px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; min-width: 0; }
        .input-bar input:focus { box-shadow: 0 0 0 2px var(--accent); }
        .input-btn { background: none; border: none; color: var(--text3); font-size: 20px; cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
        .input-btn:hover { background: var(--surface3); }
        .send-btn { background: var(--accent) !important; color: #fff !important; border-radius: 50% !important; width: 42px !important; height: 42px !important; font-size: 18px !important; }
        .mic-btn { background: var(--green) !important; color: #fff !important; border-radius: 50% !important; width: 42px !important; height: 42px !important; }
        .mic-btn.recording { background: #ff0000 !important; animation: pulseRec 0.8s infinite; }
        @keyframes pulseRec { 0%,100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.5); } 50% { box-shadow: 0 0 0 15px rgba(255,0,0,0); } }

        .emoji-picker { position: absolute; bottom: 75px; right: 10px; background: var(--surface); border-radius: 20px; padding: 8px; width: 300px; max-height: 240px; overflow-y: auto; display: none; flex-wrap: wrap; gap: 4px; z-index: 100; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .emoji-picker.show { display: flex; }
        .emoji-picker span { font-size: 26px; cursor: pointer; padding: 5px; border-radius: 8px; transition: all 0.15s; }
        .emoji-picker span:hover { background: var(--surface3); transform: scale(1.2); }

        .image-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
        .image-viewer.active { display: flex; }
        .image-viewer img { max-width: 95vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,0.8); animation: zoomIn 0.25s ease; }
        @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .image-viewer-close { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; z-index: 3001; }

        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 13px; z-index: 5000; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow); font-family: inherit; }
        .toast.show { opacity: 1; }

        .popup-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; display: none; justify-content: flex-end; align-items: flex-start; backdrop-filter: blur(2px); }
        .popup-overlay.active { display: flex; }
        .popup-menu { background: var(--surface); border-radius: 16px; margin: 60px 12px 0 0; width: 240px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; animation: slideIn 0.25s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        .popup-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; color: var(--text2); font-size: 13px; border-bottom: 1px solid var(--border); transition: 0.15s; }
        .popup-item:last-child { border-bottom: none; }
        .popup-item:hover { background: var(--surface3); }
        .popup-item i { width: 20px; font-size: 16px; color: var(--text3); text-align: center; }
        .popup-item.danger { color: #ff4444; }
    </style>
</head>
<body>
    <div class="chat-header-bar">
        <button class="header-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
        <div class="avatar" id="chatAvatar">👤</div>
        <div class="chat-header-info" id="chatHeaderInfo">
            <div class="chat-header-name" id="chatNameDisp">محادثة</div>
            <div class="chat-header-status online" id="chatStatusDisp">متصل</div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="voiceCallBtn"><i class="fas fa-phone"></i></button>
            <button class="header-btn" id="videoCallBtn"><i class="fas fa-video"></i></button>
            <button class="header-btn" id="chatMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
        </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="reply-bar" id="replyBar" style="display:none;">
        <span><i class="fas fa-reply"></i> <span id="replyPreview"></span></span>
        <button class="header-btn" id="cancelReplyBtn">&times;</button>
    </div>

    <div class="input-bar">
        <button class="input-btn" id="emojiBtn"><i class="far fa-smile-wink"></i></button>
        <button class="input-btn" id="attachBtn"><i class="fas fa-paperclip"></i></button>
        <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
        <button class="input-btn send-btn" id="sendMsgBtn" style="display:none;"><i class="fas fa-paper-plane"></i></button>
        <button class="input-btn mic-btn" id="micBtn" style="display:flex;"><i class="fas fa-microphone"></i></button>
    </div>

    <div class="emoji-picker" id="emojiPicker"></div>
    <input type="file" id="hiddenFileInput" style="display:none;" accept="image/*,video/*,.pdf,.doc,.docx">

    <div class="image-viewer" id="imageViewer">
        <button class="image-viewer-close" id="closeImageViewer">&times;</button>
        <img src="" alt="صورة" id="viewerImage">
    </div>
    <div class="toast" id="toast"></div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-menu" id="popupMenu"></div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/sqlite-local.js"></script>
    <script src="js/common.js"></script>

    <script>
        // ========== المتغيرات العامة ==========
        let socket = null;
        let currentUser = null;
        let currentChatId = null;
        let pendingMediaUrl = null;
        let pendingVoice = null;
        let replyToMsg = null;

        const SERVER_URL = 'https://ramzapp.onrender.com';

        function toast(msg, dur=2000) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), dur);
        }

        function esc(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
        }

        function genId() {
            return 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
        }

        function fmtTime(d) {
            return new Date(d).toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
        }

        function appendMessageToView(m, animate = true) {
            const area = document.getElementById('messagesArea');
            if (document.getElementById(`msg-${m.id}`)) return;

            const isMe = (m.senderId === currentUser.id);
            const hasImg = m.mediaUrl && !m.voiceUrl && (m.mediaUrl.match(/\.(jpeg|jpg|gif|png|webp)$/i) || m.mediaUrl.includes('blob:'));
            const hasVoice = m.voiceUrl || (m.mediaUrl && m.mediaUrl.match(/\.(webm|mp3|ogg)$/i));
            const div = document.createElement('div');
            div.className = `msg-row ${isMe ? 'own' : 'other'}`;
            div.id = `msg-${m.id}`;
            const displayMediaUrl = m.mediaUrl;
            div.innerHTML = `
                <div class="msg-bubble">
                    ${m.replyTo ? `<div class="reply-preview" style="font-size:11px;color:var(--text3);margin-bottom:4px;"><i class="fas fa-reply"></i> رد على رسالة</div>` : ''}
                    ${hasVoice ? `<div class="voice-msg"><button class="voice-play-btn" data-audio="${displayMediaUrl}" onclick="playVoice(this)"><i class="fas fa-play"></i></button><div class="voice-wave">${Array.from({ length: 8 }, () => `<div class="voice-wave-bar" style="height:${8 + Math.random() * 16}px"></div>`).join('')}</div><span style="font-size:10px;color:var(--text3);">${m.voiceDuration || '0:00'}</span></div>` : ''}
                    ${hasImg ? `<img src="${displayMediaUrl}" class="attachment-img" onclick="openImageViewer('${displayMediaUrl.replace(/'/g, "\\'")}')" loading="lazy">` : ''}
                    <div>${esc(m.text || '')}</div>
                    <div class="msg-time-row"><span>${fmtTime(m.timestamp)}</span>${isMe ? (m.status === 'read' ? '<i class="fas fa-check-double" style="color:#4fc3f7;"></i>' : m.status === 'delivered' ? '<i class="fas fa-check-double"></i>' : '<i class="fas fa-check"></i>') : ''}</div>
                </div>`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        async function renderMessagesFromLocal() {
            const msgs = await RamzDB.getMessages(currentChatId);
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            (msgs || []).forEach(m => appendMessageToView(m, false));
            area.scrollTop = area.scrollHeight;
        }

        function openImageViewer(src) {
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewerImage');
            img.src = src;
            viewer.classList.add('active');
        }
        document.getElementById('closeImageViewer').addEventListener('click', () => {
            document.getElementById('imageViewer').classList.remove('active');
        });

        window.playVoice = function(btn) {
            const audioSrc = btn.dataset.audio;
            if (!audioSrc) return;
            const audio = new Audio(audioSrc);
            const icon = btn.querySelector('i');
            if (icon) icon.className = 'fas fa-pause';
            audio.play();
            audio.onended = () => { if (icon) icon.className = 'fas fa-play'; };
            btn.onclick = () => {
                if (audio.paused) { audio.play(); if (icon) icon.className = 'fas fa-pause'; }
                else { audio.pause(); if (icon) icon.className = 'fas fa-play'; }
            };
        };

        function connectAndLogin() {
            return new Promise((resolve, reject) => {
                socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
                socket.on('connect', () => {
                    console.log('✅ متصل بخادم Socket.IO');
                    socket.emit('login', { username: currentUser.name }, (response) => {
                        if (response && response.error) {
                            toast(response.error);
                            reject(response.error);
                        } else {
                            if (response?.user?.id) currentUser.id = response.user.id;
                            resolve();
                        }
                    });
                });
                socket.on('connect_error', (err) => {
                    console.error(err);
                    toast('⚠️ لا يمكن الاتصال بالخادم');
                    reject(err);
                });
                socket.on('message:receive', async (message) => {
                    await RamzDB.saveMessage(message);
                    appendMessageToView(message);
                    if (document.hidden && message.senderId !== currentUser.id) {
                        toast(`📩 رسالة جديدة من ${message.senderName || ''}`);
                    }
                });
                socket.on('typing:update', ({ chatId, username, typing }) => {
                    if (chatId !== currentChatId) return;
                    const statusDiv = document.getElementById('chatStatusDisp');
                    if (typing) {
                        statusDiv.textContent = `${username || 'المستخدم'} يكتب...`;
                        statusDiv.className = 'chat-header-status typing';
                    } else {
                        statusDiv.textContent = 'متصل';
                        statusDiv.className = 'chat-header-status online';
                    }
                });
                socket.on('chat:history', async (messages) => {
                    if (!messages || messages.length === 0) return;
                    for (const msg of messages) {
                        await RamzDB.saveMessage(msg);
                        appendMessageToView(msg, false);
                    }
                    document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
                });
            });
        }

        function joinChatRoom() {
            if (!socket || !currentChatId) return;
            socket.emit('chat:join', { chatId: currentChatId, userId: currentUser.id });
        }

        async function sendMessage() {
            const text = document.getElementById('msgInput').value.trim();
            if (!text && !pendingMediaUrl && !pendingVoice) return;

            let finalMediaUrl = pendingMediaUrl;
            let voiceDuration = null;
            if (pendingVoice) {
                try {
                    toast('⏳ جاري رفع التسجيل الصوتي...');
                    const blob = pendingVoice.blob;
                    const file = new File([blob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
                    const uploadedUrl = await uploadFileToServer(file);
                    if (uploadedUrl) {
                        finalMediaUrl = uploadedUrl;
                        voiceDuration = pendingVoice.duration;
                    } else {
                        toast('❌ فشل رفع الصوت');
                        return;
                    }
                } catch (err) {
                    toast('❌ خطأ في رفع الصوت');
                    return;
                }
                pendingVoice = null;
            }

            const messageData = {
                chatId: currentChatId,
                text: text || (finalMediaUrl && !pendingMediaUrl ? '🎤 رسالة صوتية' : ''),
                mediaUrl: finalMediaUrl || null,
                voiceDuration: voiceDuration
            };

            const tempId = genId();
            const tempMsg = {
                id: tempId,
                chatId: currentChatId,
                senderId: currentUser.id,
                senderName: currentUser.name,
                text: messageData.text,
                mediaUrl: messageData.mediaUrl,
                voiceUrl: (messageData.mediaUrl && messageData.mediaUrl.match(/\.(webm|mp3)$/i)) ? messageData.mediaUrl : null,
                voiceDuration: voiceDuration,
                replyTo: replyToMsg ? replyToMsg.id : null,
                timestamp: new Date().toISOString(),
                status: 'sending'
            };
            appendMessageToView(tempMsg);
            await RamzDB.saveMessage(tempMsg);

            socket.emit('message:send', messageData, async (response) => {
                if (response && response.success) toast('✅ تم الإرسال');
                else toast('❌ فشل الإرسال');
            });

            document.getElementById('msgInput').value = '';
            pendingMediaUrl = null;
            updateSendBtn();
            if (replyToMsg) {
                document.getElementById('replyBar').style.display = 'none';
                replyToMsg = null;
            }
        }

        async function uploadFileToServer(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const response = await fetch(`${SERVER_URL}/api/upload`, { method: 'POST', body: formData });
                const data = await response.json();
                return data.url || null;
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        async function handleFileSelection(file) {
            if (!file) return;
            toast('⏳ جاري رفع الملف...');
            const uploadedUrl = await uploadFileToServer(file);
            if (uploadedUrl) {
                pendingMediaUrl = uploadedUrl;
                toast('✅ تم رفع الملف، اضغط إرسال');
                updateSendBtn();
            } else {
                toast('❌ فشل رفع الملف');
            }
        }

        let mediaRecorder = null;
        let recordingChunks = [];
        let isRecording = false;

        async function startRecording(e) {
            e.preventDefault();
            if (isRecording) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isRecording = true;
                const micBtn = document.getElementById('micBtn');
                micBtn.classList.add('recording');
                toast('🎤 جاري التسجيل... اضغط مع الاستمرار');
                mediaRecorder = new MediaRecorder(stream);
                recordingChunks = [];
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordingChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordingChunks, { type: 'audio/webm' });
                    const duration = Math.floor(recordingChunks.length * 0.05);
                    const durationStr = '0:' + Math.min(duration, 59).toString().padStart(2, '0');
                    pendingVoice = { blob, duration: durationStr };
                    updateSendBtn();
                    toast('✅ تم التسجيل، اضغط إرسال');
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start();
                setTimeout(() => {
                    if (isRecording && mediaRecorder?.state === 'recording') {
                        mediaRecorder.stop();
                        isRecording = false;
                        micBtn.classList.remove('recording');
                    }
                }, 30000);
            } catch (err) {
                toast('⚠️ لا يمكن الوصول للميكروفون');
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            }
        }

        function stopRecording() {
            if (isRecording && mediaRecorder?.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            }
        }

        const micBtnElem = document.getElementById('micBtn');
        micBtnElem.addEventListener('mousedown', startRecording);
        micBtnElem.addEventListener('touchstart', startRecording);
        micBtnElem.addEventListener('mouseup', stopRecording);
        micBtnElem.addEventListener('touchend', stopRecording);
        micBtnElem.addEventListener('mouseleave', stopRecording);
        micBtnElem.addEventListener('touchcancel', stopRecording);

        const msgInputElem = document.getElementById('msgInput');
        let typingTimer = null;
        msgInputElem.addEventListener('input', () => {
            if (socket && currentChatId) {
                socket.emit('typing:start', { chatId: currentChatId });
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    socket.emit('typing:stop', { chatId: currentChatId });
                }, 1000);
            }
            updateSendBtn();
        });

        function updateSendBtn() {
            const has = msgInputElem.value.trim().length > 0 || pendingMediaUrl || pendingVoice;
            document.getElementById('sendMsgBtn').style.display = has ? 'flex' : 'none';
            micBtnElem.style.display = has ? 'none' : 'flex';
        }

        const emojis = ['😀','😂','😍','😢','😡','👍','❤️','🔥','🎉','😎','🤔','😴','🥳','😇','🤗','😤','😱','💔','✨','🌟','💡','📎','📷','🎵','📍','🙏','💪','👀','🤝','🚀','💯','✅','❌','🎯'];
        const ep = document.getElementById('emojiPicker');
        emojis.forEach(e => {
            const span = document.createElement('span');
            span.textContent = e;
            span.addEventListener('click', () => {
                msgInputElem.value += e;
                ep.classList.remove('show');
                msgInputElem.focus();
                updateSendBtn();
            });
            ep.appendChild(span);
        });
        document.getElementById('emojiBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            ep.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!ep.contains(e.target) && e.target !== document.getElementById('emojiBtn')) ep.classList.remove('show');
        });

        document.getElementById('attachBtn').addEventListener('click', () => {
            document.getElementById('hiddenFileInput').click();
        });
        document.getElementById('hiddenFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) await handleFileSelection(file);
            e.target.value = '';
        });

        document.getElementById('chatMenuBtn').addEventListener('click', () => {
            const items = [
                { icon: 'fa-address-card', label: 'عرض جهة الاتصال', action: () => { toast(`👤 ${document.getElementById('chatNameDisp').textContent}`); } },
                { icon: 'fa-search', label: 'بحث في المحادثة', action: async () => {
                    const query = prompt('🔍 ابحث في المحادثة:');
                    if (query && query.trim()) {
                        const msgs = await RamzDB.getMessages(currentChatId);
                        const found = msgs.filter(m => m.text && m.text.includes(query.trim()));
                        if (found.length > 0) {
                            const el = document.getElementById('msg-' + found[0].id);
                            if (el) {
                                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                el.style.background = 'rgba(255,200,0,0.15)';
                                setTimeout(() => el.style.background = '', 1500);
                            }
                            toast(`✅ تم العثور على ${found.length} رسالة`);
                        } else toast('❌ لا توجد نتائج');
                    }
                }},
                { icon: 'fa-photo-video', label: 'وسائط', action: () => { toast('📷 وسائط المحادثة'); } },
                { icon: 'fa-cog', label: 'الإعدادات', action: () => { location.href = 'chats.html#settings'; } },
                { icon: 'fa-trash-alt', label: 'حذف المحادثة', action: async () => {
                    if (confirm('⚠️ حذف هذه المحادثة؟')) {
                        await RamzDB.deleteMessages(currentChatId);
                        history.back();
                    }
                }, danger: true }
            ];
            const menu = document.getElementById('popupMenu');
            menu.innerHTML = items.map(i => `<div class="popup-item${i.danger?' danger':''}"><i class="fas ${i.icon}"></i>${i.label}</div>`).join('');
            document.getElementById('popupOverlay').classList.add('active');
            menu.querySelectorAll('.popup-item').forEach((el, idx) => {
                el.addEventListener('click', () => {
                    items[idx].action();
                    document.getElementById('popupOverlay').classList.remove('active');
                });
            });
        });
        document.getElementById('popupOverlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.getElementById('voiceCallBtn').addEventListener('click', () => toast('📞 مكالمة صوتية (قريباً)'));
        document.getElementById('videoCallBtn').addEventListener('click', () => toast('📹 مكالمة فيديو (قريباً)'));

        async function init() {
            // انتظار تحميل RamzDB (من common.js أو sqlite-local.js)
            if (typeof RamzDB === 'undefined') {
                toast('⚠️ انتظار تحميل قاعدة البيانات...');
                setTimeout(init, 500);
                return;
            }
            const saved = await RamzDB.getUser();
            if (!saved) {
                location.href = 'login.html';
                return;
            }
            currentUser = saved;
            if (!currentUser.id) currentUser.id = 'local_' + Date.now();

            const params = new URLSearchParams(location.search);
            currentChatId = params.get('chatId');
            const chatName = params.get('name') || 'محادثة';
            document.getElementById('chatNameDisp').textContent = chatName;
            document.getElementById('chatAvatar').textContent = chatName.charAt(0);

            await renderMessagesFromLocal();

            try {
                await connectAndLogin();
                joinChatRoom();
            } catch (err) {
                console.warn(err);
                toast('⚠️ فشل الاتصال بالخادم، العمل محلياً');
            }

            const sendBtn = document.getElementById('sendMsgBtn');
            sendBtn.addEventListener('click', sendMessage);
            msgInputElem.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
            updateSendBtn();

            const theme = await RamzDB.getSetting('theme');
            if (theme === 'light') document.body.classList.add('light-theme');
        }

        init();
    </script>
</body>
</html>
