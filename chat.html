<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ RamzApp | غرفة المحادثة</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          onerror="this.onerror=null;document.getElementById('faFallback').removeAttribute('disabled')">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css"
          id="faFallback" disabled>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --surface2: #222;
            --surface3: #2a2a2a;
            --text: #fff;
            --text2: #ddd;
            --text3: #999;
            --border: #2c2c2c;
            --accent: #ff0050;
            --green: #00a884;
            --online: #00a884;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .light-theme {
            --bg: #f0f2f5;
            --surface: #fff;
            --surface2: #f5f5f5;
            --surface3: #e9edef;
            --text: #111;
            --text2: #333;
            --text3: #667781;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .chat-header-bar {
            background: var(--surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            min-height: 56px;
        }
        .header-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .header-btn:hover {
            background: var(--surface3);
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--surface3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }
        .chat-header-info {
            flex: 1;
            cursor: pointer;
            min-width: 0;
        }
        .chat-header-name {
            font-weight: 700;
            font-size: 15px;
        }
        .chat-header-status {
            font-size: 11px;
            color: var(--text3);
        }
        .chat-header-status.online {
            color: var(--online);
        }
        .chat-header-status.typing {
            color: var(--green);
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg);
            background-image: radial-gradient(circle at center, var(--border) 1px, transparent 1px);
            background-size: 32px 32px;
            scroll-behavior: smooth;
        }
        .msg-row {
            display: flex;
            width: 100%;
            animation: fadeUp 0.3s ease;
        }
        .msg-row.own {
            justify-content: flex-end;
        }
        .msg-bubble {
            max-width: 84%;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.5;
            position: relative;
            word-break: break-word;
        }
        .own .msg-bubble {
            background: #005c4b;
            color: #e9ffef;
            border-bottom-left-radius: 4px;
        }
        .light-theme .own .msg-bubble {
            background: #d9fdd3;
            color: #111;
        }
        .other .msg-bubble {
            background: var(--surface2);
            color: var(--text2);
            border: 1px solid var(--border);
            border-bottom-right-radius: 4px;
        }
        .attachment-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .attachment-img:hover {
            transform: scale(1.02);
        }
        .voice-msg {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }
        .voice-play-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-play-btn:hover {
            transform: scale(1.1);
        }
        .msg-time-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
            font-size: 10px;
            color: var(--text3);
        }
        .input-bar {
            background: var(--surface);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid var(--border);
        }
        .input-bar input {
            flex: 1;
            background: var(--surface3);
            border: none;
            border-radius: 25px;
            padding: 10px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        .input-bar input:focus {
            box-shadow: 0 0 0 2px var(--accent);
        }
        .input-btn {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 20px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .input-btn:hover {
            background: var(--surface3);
        }
        .send-btn {
            background: var(--accent) !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 42px !important;
            height: 42px !important;
        }
        .mic-btn {
            background: var(--green) !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 42px !important;
            height: 42px !important;
        }
        .mic-btn.recording {
            background: #ff0000 !important;
            animation: pulseRec 0.8s infinite;
        }
        @keyframes pulseRec {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255,0,0,0); }
        }
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            right: 10px;
            background: var(--surface);
            border-radius: 20px;
            padding: 8px;
            width: 300px;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            flex-wrap: wrap;
            gap: 4px;
            z-index: 100;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .emoji-picker.show {
            display: flex;
        }
        .emoji-picker span {
            font-size: 26px;
            cursor: pointer;
            padding: 5px;
            border-radius: 8px;
        }
        .emoji-picker span:hover {
            background: var(--surface3);
        }
        .image-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        .image-viewer.active {
            display: flex;
        }
        .image-viewer img {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 8px;
            animation: zoomIn 0.25s ease;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .image-viewer-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            z-index: 5000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: var(--shadow);
        }
        .toast.show {
            opacity: 1;
        }
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
            justify-content: flex-end;
            align-items: flex-start;
            backdrop-filter: blur(2px);
        }
        .popup-overlay.active {
            display: flex;
        }
        .popup-menu {
            background: var(--surface);
            border-radius: 16px;
            margin: 60px 12px 0 0;
            width: 240px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .popup-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
            color: var(--text2);
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            transition: 0.15s;
        }
        .popup-item:last-child {
            border-bottom: none;
        }
        .popup-item:hover {
            background: var(--surface3);
        }
        .popup-item i {
            width: 20px;
            font-size: 16px;
            color: var(--text3);
            text-align: center;
        }
        .popup-item.danger {
            color: #ff4444;
        }
        .call-screen-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            z-index: 4000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            color: #fff;
        }
        .call-screen-overlay.active {
            display: flex;
        }
        #localVideo {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            border-radius: 12px;
            border: 2px solid #fff;
            z-index: 4002;
        }
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .call-end-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            z-index: 4003;
        }
    </style>
</head>
<body>

<div class="chat-header-bar">
    <button class="header-btn" id="backBtn"><i class="fas fa-arrow-right"></i></button>
    <div class="avatar" id="chatAvatar">👤</div>
    <div class="chat-header-info" id="chatHeaderInfo">
        <div class="chat-header-name" id="chatNameDisp">المحادثة</div>
        <div class="chat-header-status online" id="chatStatusDisp">متصل</div>
    </div>
    <div class="header-actions">
        <button class="header-btn" id="voiceCallBtn"><i class="fas fa-phone"></i></button>
        <button class="header-btn" id="videoCallBtn"><i class="fas fa-video"></i></button>
        <button class="header-btn" id="chatMenuBtn"><i class="fas fa-ellipsis-v"></i></button>
    </div>
</div>

<div class="messages-area" id="messagesArea"></div>

<div class="input-bar">
    <button class="input-btn" id="emojiBtn"><i class="far fa-smile-wink"></i></button>
    <button class="input-btn" id="attachBtn"><i class="fas fa-paperclip"></i></button>
    <input type="text" id="msgInput" placeholder="اكتب رسالة..." autocomplete="off">
    <button class="input-btn send-btn" id="sendMsgBtn" style="display:none;"><i class="fas fa-paper-plane"></i></button>
    <button class="input-btn mic-btn" id="micBtn" style="display:flex;"><i class="fas fa-microphone"></i></button>
</div>

<div class="emoji-picker" id="emojiPicker"></div>
<input type="file" id="hiddenFileInput" style="display:none;" accept="image/*,video/*,.pdf,.doc,.docx">

<div class="image-viewer" id="imageViewer">
    <button class="image-viewer-close" id="closeImageViewerBtn">&times;</button>
    <img src="" alt="صورة" id="viewerImage">
</div>
<div class="toast" id="toast"></div>
<div class="popup-overlay" id="popupOverlay">
    <div class="popup-menu" id="popupMenu"></div>
</div>

<div class="call-screen-overlay" id="callContainer">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
    <button class="call-end-btn" id="endCallBtn"><i class="fas fa-phone-slash"></i></button>
</div>

<!-- ========== المكتبات الأساسية بالترتيب الصحيح ========== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="js/sqlite-local.js"></script>
<script src="js/webrtc-client.js"></script>
<script src="js/media-storage.js"></script>
<script src="js/common.js"></script>

<script>
    // ========== الإعدادات العامة ==========
    const SERVER_URL = window.RAMZ_SERVER_URL || 'https://ramzapp.onrender.com';
    let socket = null;
    let currentUser = null;
    let chatId = null;
    let chatName = '';
    let pendingVoice = null;
    let isRecording = false;
    let mediaRecorder = null;
    let recordingChunks = [];

    // عناصر DOM
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendMsgBtn');
    const micBtn = document.getElementById('micBtn');
    const messagesArea = document.getElementById('messagesArea');
    const chatNameDisp = document.getElementById('chatNameDisp');
    const chatAvatar = document.getElementById('chatAvatar');
    const backBtn = document.getElementById('backBtn');
    const attachBtn = document.getElementById('attachBtn');
    const hiddenFileInput = document.getElementById('hiddenFileInput');
    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const voiceCallBtn = document.getElementById('voiceCallBtn');
    const videoCallBtn = document.getElementById('videoCallBtn');
    const chatMenuBtn = document.getElementById('chatMenuBtn');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupMenu = document.getElementById('popupMenu');
    const callContainer = document.getElementById('callContainer');
    const endCallBtn = document.getElementById('endCallBtn');
    const imageViewer = document.getElementById('imageViewer');
    const viewerImage = document.getElementById('viewerImage');
    const closeImageViewerBtn = document.getElementById('closeImageViewerBtn');

    // ========== تهيئة WebRTC ==========
    if (typeof RamzCall !== 'undefined') {
        RamzCall.setVideoElements('localVideo', 'remoteVideo');
    }

    // ========== الحصول على جلسة المستخدم وبدء الدردشة ==========
    async function initChat() {
        currentUser = await getSessionUser();
        if (!currentUser) return;

        const params = new URLSearchParams(location.search);
        chatId = params.get('chatId');
        chatName = params.get('name') || 'محادثة';
        if (!chatId) {
            toast('معرّف المحادثة غير موجود');
            setTimeout(() => { window.location.href = 'chats.html'; }, 1500);
            return;
        }
        chatNameDisp.textContent = chatName;
        chatAvatar.textContent = chatName.charAt(0).toUpperCase();

        // تحميل الرسائل من SQLite
        await renderMessages();

        // إعداد Socket.IO
        setupSocket();

        // استرجاع إعداد الوضع الليلي
        const theme = await RamzDB.getSetting('theme');
        if (theme === 'light') document.body.classList.add('light-theme');
    }

    // ========== عرض الرسائل من قاعدة البيانات المحلية ==========
    async function renderMessages() {
        if (!chatId) return;
        const msgs = await RamzDB.getMessages(chatId);
        messagesArea.innerHTML = '';
        msgs.forEach(msg => appendMessageToView(msg, false));
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function appendMessageToView(msg, animate = true) {
        if (document.getElementById(`msg-${msg.id}`)) return;
        const isMe = msg.senderId === currentUser.id;
        const hasImg = msg.mediaUrl && !msg.voiceUrl;
        const hasVoice = msg.voiceUrl;
        const div = document.createElement('div');
        div.className = `msg-row ${isMe ? 'own' : 'other'}`;
        div.id = `msg-${msg.id}`;
        let innerHtml = `<div class="msg-bubble">`;
        if (hasVoice) {
            innerHtml += `<div class="voice-msg">
                            <button class="voice-play-btn" data-audio="${esc(msg.voiceUrl)}" onclick="window.playVoiceMessage(this)">
                                <i class="fas fa-play"></i>
                            </button>
                            <span style="font-size:10px;color:var(--text3);">${msg.voiceDuration || '0:00'}</span>
                          </div>`;
        }
        if (hasImg) {
            innerHtml += `<img src="${msg.mediaUrl}" class="attachment-img" onclick="window.openImageViewer('${msg.mediaUrl}')" loading="lazy">`;
        }
        if (msg.text) {
            innerHtml += `<div>${esc(msg.text)}</div>`;
        }
        innerHtml += `<div class="msg-time-row">
                        <span>${fmtTime(msg.timestamp)}</span>
                        ${isMe ? (msg.status === 'read' ? '<i class="fas fa-check-double" style="color:#4fc3f7;"></i>' : '<i class="fas fa-check"></i>') : ''}
                      </div>`;
        innerHtml += `</div>`;
        div.innerHTML = innerHtml;
        messagesArea.appendChild(div);
        if (animate) messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ========== اتصال Socket.IO ==========
    function setupSocket() {
        if (!chatId) return;
        socket = io(SERVER_URL, { transports: ['websocket'] });
        socket.on('connect', () => {
            console.log('✅ متصل بالخادم الوسيط');
            socket.emit('login', { username: currentUser.name }, (res) => {
                if (res && res.error) console.warn('خطأ في login:', res.error);
            });
            socket.emit('chat:join', { chatId, userId: currentUser.id });
        });
        socket.on('chat:history', async (msgs) => {
            if (msgs && msgs.length) {
                for (const m of msgs) {
                    await RamzDB.saveMessage(m);
                    appendMessageToView(m);
                }
            }
        });
        socket.on('message:receive', async (msg) => {
            if (msg.chatId !== chatId) return;
            await RamzDB.saveMessage(msg);
            appendMessageToView(msg);
            if (msg.mediaUrl && typeof RamzMedia !== 'undefined') {
                RamzMedia.autoSaveMedia(msg.mediaUrl, msg.senderName);
            }
            // إشعار عند تصفح خارج الصفحة
            if (document.hidden && msg.senderId !== currentUser.id) {
                toast(`📩 رسالة جديدة من ${msg.senderName || 'الطرف الآخر'}`);
            }
        });
        socket.on('typing:update', (data) => {
            if (data.chatId === chatId) {
                const statusDiv = document.getElementById('chatStatusDisp');
                if (data.typing) {
                    statusDiv.textContent = `${data.username || 'الطرف الآخر'} يكتب...`;
                    statusDiv.className = 'chat-header-status typing';
                } else {
                    statusDiv.textContent = 'متصل';
                    statusDiv.className = 'chat-header-status online';
                }
            }
        });
        socket.on('disconnect', () => {
            console.warn('⚠️ قطع الاتصال بالخادم الوسيط');
        });
    }

    // ========== إرسال رسالة نصية ==========
    function updateSendBtn() {
        const hasText = msgInput.value.trim().length > 0;
        const hasVoice = !!pendingVoice;
        sendBtn.style.display = (hasText || hasVoice) ? 'flex' : 'none';
        micBtn.style.display = (hasText || hasVoice) ? 'none' : 'flex';
    }

    msgInput.addEventListener('input', updateSendBtn);
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    // مؤشر الكتابة
    let typingTimeout;
    msgInput.addEventListener('input', () => {
        if (socket && socket.connected) {
            socket.emit('typing:start', { chatId });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing:stop', { chatId });
            }, 1000);
        }
    });

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text && !pendingVoice) return;
        const messageId = genId();
        const msg = {
            id: messageId,
            chatId: chatId,
            senderId: currentUser.id,
            senderName: currentUser.name,
            text: text || (pendingVoice ? '🎤 رسالة صوتية' : ''),
            mediaUrl: null,
            voiceUrl: pendingVoice?.url || null,
            voiceDuration: pendingVoice?.duration || null,
            timestamp: new Date().toISOString(),
            status: 'sent'
        };
        await RamzDB.saveMessage(msg);
        msgInput.value = '';
        pendingVoice = null;
        appendMessageToView(msg);
        updateSendBtn();
        if (socket && socket.connected) {
            socket.emit('message:send', {
                chatId,
                text: msg.text,
                mediaUrl: msg.mediaUrl,
                voiceUrl: msg.voiceUrl,
                voiceDuration: msg.voiceDuration
            });
        } else {
            toast('⚠️ لا يوجد اتصال بالخادم، سيتم حفظ الرسالة محلياً فقط');
        }
    }

    // ========== تسجيل صوتي ==========
    async function startRecording(e) {
        e.preventDefault();
        if (isRecording) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isRecording = true;
            micBtn.classList.add('recording');
            toast('🎙️ سجل رسالتك... اضغط مرة أخرى للإيقاف', 3000);
            mediaRecorder = new MediaRecorder(stream);
            recordingChunks = [];
            mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) recordingChunks.push(ev.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordingChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const durationSec = Math.floor(recordingChunks.length * 0.05);
                const durationFormatted = `0:${Math.min(durationSec, 59).toString().padStart(2, '0')}`;
                pendingVoice = { url, duration: durationFormatted };
                updateSendBtn();
                toast('✅ تم التسجيل، اضغط الإرسال', 1500);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            // تسجيل تلقائي بحد أقصى 15 ثانية
            setTimeout(() => {
                if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                    stopRecording();
                }
            }, 15000);
        } catch (err) {
            toast('❌ لا يمكن الوصول إلى الميكروفون');
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    }
    function stopRecording() {
        if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    }
    micBtn.addEventListener('mousedown', startRecording);
    micBtn.addEventListener('touchstart', startRecording);
    micBtn.addEventListener('mouseup', stopRecording);
    micBtn.addEventListener('touchend', stopRecording);
    micBtn.addEventListener('mouseleave', stopRecording);

    // ========== رفع الصور باستخدام SupabaseClient ==========
    attachBtn.addEventListener('click', () => hiddenFileInput.click());
    hiddenFileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        toast('⏫ جاري رفع الصورة...');
        try {
            if (typeof SupabaseClient === 'undefined') throw new Error('SupabaseClient غير معرف');
            const url = await SupabaseClient.uploadImage(file);
            const msg = {
                id: genId(),
                chatId: chatId,
                senderId: currentUser.id,
                senderName: currentUser.name,
                text: '',
                mediaUrl: url,
                voiceUrl: null,
                voiceDuration: null,
                timestamp: new Date().toISOString(),
                status: 'sent'
            };
            await RamzDB.saveMessage(msg);
            appendMessageToView(msg);
            if (socket && socket.connected) {
                socket.emit('message:send', { chatId, text: '', mediaUrl: url });
            }
            toast('✅ تم إرسال الصورة');
        } catch (err) {
            toast('❌ فشل رفع الصورة: ' + err.message);
            console.error(err);
        }
        hiddenFileInput.value = '';
    });

    // ========== دوال مساعدة ==========
    window.openImageViewer = function(src) {
        viewerImage.src = src;
        imageViewer.classList.add('active');
    };
    closeImageViewerBtn.addEventListener('click', () => imageViewer.classList.remove('active'));
    imageViewer.addEventListener('click', (e) => {
        if (e.target === imageViewer) imageViewer.classList.remove('active');
    });

    window.playVoiceMessage = function(btn) {
        const audioSrc = btn.getAttribute('data-audio');
        if (!audioSrc) return;
        const audio = new Audio(audioSrc);
        const icon = btn.querySelector('i');
        if (icon) icon.className = 'fas fa-pause';
        audio.play();
        audio.onended = () => { if (icon) icon.className = 'fas fa-play'; };
        btn.onclick = () => {
            if (audio.paused) {
                audio.play();
                if (icon) icon.className = 'fas fa-pause';
            } else {
                audio.pause();
                if (icon) icon.className = 'fas fa-play';
            }
        };
    };

    // ========== إيموجي بسيط ==========
    const emojisList = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥸','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟'];
    emojisList.forEach(emoji => {
        const span = document.createElement('span');
        span.textContent = emoji;
        span.addEventListener('click', () => {
            msgInput.value += emoji;
            emojiPicker.classList.remove('show');
            msgInput.focus();
            updateSendBtn();
        });
        emojiPicker.appendChild(span);
    });
    emojiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        emojiPicker.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
        if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
            emojiPicker.classList.remove('show');
        }
    });

    // ========== قائمة المحادثة (حذف، بحث، معلومات) ==========
    chatMenuBtn.addEventListener('click', () => {
        const items = [
            { icon: 'fa-info-circle', label: 'معلومات المحادثة', action: () => toast(`📄 ${chatName}`) },
            { icon: 'fa-search', label: 'بحث في الرسائل', action: async () => {
                const query = prompt('🔍 أدخل كلمة البحث:');
                if (query && query.trim()) {
                    const msgs = await RamzDB.getMessages(chatId);
                    const found = msgs.filter(m => m.text && m.text.includes(query.trim()));
                    if (found.length) {
                        toast(`🔍 وجدت ${found.length} رسالة`, 2000);
                        const firstMsg = document.getElementById(`msg-${found[0].id}`);
                        if (firstMsg) firstMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    } else {
                        toast('❌ لا توجد نتائج');
                    }
                }
            } },
            { icon: 'fa-trash-alt', label: 'حذف المحادثة', action: async () => {
                if (confirm('⚠️ هل تريد حذف جميع رسائل هذه المحادثة؟')) {
                    await RamzDB.deleteMessages(chatId);
                    await renderMessages();
                    toast('✅ تم حذف المحادثة');
                }
            }, danger: true }
        ];
        popupMenu.innerHTML = items.map(i => `<div class="popup-item${i.danger ? ' danger' : ''}"><i class="fas ${i.icon}"></i>${i.label}</div>`).join('');
        popupOverlay.classList.add('active');
        const menuItems = popupMenu.querySelectorAll('.popup-item');
        menuItems.forEach((el, idx) => {
            el.addEventListener('click', () => {
                items[idx].action();
                popupOverlay.classList.remove('active');
            });
        });
    });
    popupOverlay.addEventListener('click', (e) => {
        if (e.target === popupOverlay) popupOverlay.classList.remove('active');
    });

    // ========== مكالمات WebRTC ==========
    async function startWebRTCCall(videoEnabled) {
        try {
            callContainer.classList.add('active');
            if (typeof RamzCall !== 'undefined') {
                // تمرير خيار الفيديو بناءً على الزر
                const constraints = { audio: true, video: videoEnabled };
                await RamzCall.startCall(constraints);
            } else {
                toast('❌ WebRTC غير متاح');
                callContainer.classList.remove('active');
            }
        } catch (err) {
            toast('فشل بدء المكالمة: ' + err.message);
            callContainer.classList.remove('active');
        }
    }
    voiceCallBtn.addEventListener('click', () => startWebRTCCall(false));
    videoCallBtn.addEventListener('click', () => startWebRTCCall(true));
    endCallBtn.addEventListener('click', () => {
        if (typeof RamzCall !== 'undefined') RamzCall.endCall();
        callContainer.classList.remove('active');
    });

    // ========== زر الرجوع ==========
    backBtn.addEventListener('click', () => {
        if (socket && socket.connected) socket.disconnect();
        window.location.href = 'chats.html';
    });

    // بدء التطبيق
    initChat();
</script>
</body>
