<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ RamzApp | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface2: #222;
            --text: #fff;
            --text3: #999;
            --border: #2c2c2c;
            --accent: #ff0050;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .login-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 360px;
            background: var(--surface2);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .login-box h2 { font-size: 2rem; }
        .login-input {
            padding: 15px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: #0d0d0d;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .login-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255,0,80,0.1);
        }
        .phone-row {
            display: flex;
            gap: 8px;
        }
        .phone-row select {
            padding: 15px 10px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: #0d0d0d;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            outline: none;
            width: 110px;
        }
        .phone-row input { flex: 1; }
        .btn {
            padding: 15px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #ff6b8a);
            color: #fff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,0,80,0.4); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .guest-btn { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
        }
        .toast.show { opacity: 1; }
        .method-toggle {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .method-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text3);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: 0.2s;
        }
        .method-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ RamzApp</h2>
        <p style="color:var(--text3); font-size:14px;">اختر طريقة الدخول</p>

        <!-- أزرار التبديل -->
        <div class="method-toggle">
            <button class="method-btn active" id="phoneMethodBtn">📱 رقم الهاتف</button>
            <button class="method-btn" id="emailMethodBtn">📧 البريد الإلكتروني</button>
        </div>

        <!-- حقول الهاتف -->
        <div id="phoneFields">
            <div class="phone-row">
                <select id="countryCode">
                    <!-- الدول العربية أولاً -->
                    <option value="+967" selected>🇾🇪 +967 اليمن</option>
                    <option value="+966">🇸🇦 +966 السعودية</option>
                    <option value="+20">🇪🇬 +20 مصر</option>
                    <option value="+971">🇦🇪 +971 الإمارات</option>
                    <option value="+965">🇰🇼 +965 الكويت</option>
                    <option value="+974">🇶🇦 +974 قطر</option>
                    <option value="+973">🇧🇭 +973 البحرين</option>
                    <option value="+968">🇴🇲 +968 عُمان</option>
                    <option value="+962">🇯🇴 +962 الأردن</option>
                    <option value="+961">🇱🇧 +961 لبنان</option>
                    <option value="+970">🇵🇸 +970 فلسطين</option>
                    <option value="+963">🇸🇾 +963 سوريا</option>
                    <option value="+964">🇮🇶 +964 العراق</option>
                    <option value="+213">🇩🇿 +213 الجزائر</option>
                    <option value="+216">🇹🇳 +216 تونس</option>
                    <option value="+218">🇱🇾 +218 ليبيا</option>
                    <option value="+212">🇲🇦 +212 المغرب</option>
                    <option value="+222">🇲🇷 +222 موريتانيا</option>
                    <option value="+249">🇸🇩 +249 السودان</option>
                    <option value="+252">🇸🇴 +252 الصومال</option>
                    <option value="+253">🇩🇯 +253 جيبوتي</option>
                    <option value="+269">🇰🇲 +269 جزر القمر</option>

                    <!-- 10 دول أجنبية -->
                    <option value="+1">🇺🇸 +1 الولايات المتحدة</option>
                    <option value="+44">🇬🇧 +44 المملكة المتحدة</option>
                    <option value="+33">🇫🇷 +33 فرنسا</option>
                    <option value="+49">🇩🇪 +49 ألمانيا</option>
                    <option value="+39">🇮🇹 +39 إيطاليا</option>
                    <option value="+7">🇷🇺 +7 روسيا</option>
                    <option value="+86">🇨🇳 +86 الصين</option>
                    <option value="+81">🇯🇵 +81 اليابان</option>
                    <option value="+91">🇮🇳 +91 الهند</option>
                    <option value="+90">🇹🇷 +90 تركيا</option>
                </select>
                <input type="tel" class="login-input" id="phoneInput" placeholder="رقم الهاتف" autocomplete="off">
            </div>
        </div>

        <!-- حقول البريد الإلكتروني (مخفية افتراضياً) -->
        <div id="emailFields" style="display:none;">
            <input type="email" class="login-input" id="emailInput" placeholder="البريد الإلكتروني" autocomplete="off">
            <input type="password" class="login-input" id="passwordInput" placeholder="كلمة المرور" autocomplete="off" style="margin-top:8px;">
        </div>

        <input type="text" class="login-input" id="nameInput" placeholder="اسم المستخدم" autocomplete="off">

        <button class="btn" id="loginBtn">🚀 تسجيل الدخول</button>
        <button class="btn guest-btn" id="guestBtn">👤 الدخول كضيف</button>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/supabase-client.js"></script>
    <script>
        let currentMethod = 'phone';

        // ========== تبديل طريقة الدخول ==========
        document.getElementById('phoneMethodBtn').addEventListener('click', () => {
            currentMethod = 'phone';
            document.getElementById('phoneMethodBtn').classList.add('active');
            document.getElementById('emailMethodBtn').classList.remove('active');
            document.getElementById('phoneFields').style.display = 'block';
            document.getElementById('emailFields').style.display = 'none';
        });

        document.getElementById('emailMethodBtn').addEventListener('click', () => {
            currentMethod = 'email';
            document.getElementById('emailMethodBtn').classList.add('active');
            document.getElementById('phoneMethodBtn').classList.remove('active');
            document.getElementById('phoneFields').style.display = 'none';
            document.getElementById('emailFields').style.display = 'block';
        });

        function toast(msg, dur = 2000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), dur);
        }

        // ========== تسجيل الدخول ==========
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري التسجيل...';

            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                toast('⚠️ أدخل اسم المستخدم');
                btn.disabled = false;
                btn.textContent = '🚀 تسجيل الدخول';
                return;
            }

            try {
                let supabaseUser = null;

                if (currentMethod === 'phone') {
                    const phone = document.getElementById('countryCode').value + document.getElementById('phoneInput').value.trim();
                    if (!phone || phone.length < 8) {
                        toast('⚠️ أدخل رقم هاتف صحيح');
                        btn.disabled = false;
                        btn.textContent = '🚀 تسجيل الدخول';
                        return;
                    }
                    supabaseUser = await SupabaseClient.signUp(phone, name);
                } else {
                    const email = document.getElementById('emailInput').value.trim();
                    const password = document.getElementById('passwordInput').value.trim();
                    
                    if (!email) {
                        toast('⚠️ أدخل البريد الإلكتروني');
                        btn.disabled = false;
                        btn.textContent = '🚀 تسجيل الدخول';
                        return;
                    }
                    if (!password) {
                        toast('⚠️ أدخل كلمة المرور');
                        btn.disabled = false;
                        btn.textContent = '🚀 تسجيل الدخول';
                        return;
                    }
                    supabaseUser = await SupabaseClient.signUpWithEmail(email, password, name);
                }

                console.log('✅ تم التسجيل في Supabase:', supabaseUser.id);

                const sessionUser = {
                    id: supabaseUser.id,
                    name: name,
                    avatar: name.charAt(0).toUpperCase(),
                    phone: currentMethod === 'phone' ? (document.getElementById('countryCode').value + document.getElementById('phoneInput').value.trim()) : '',
                    email: currentMethod === 'email' ? document.getElementById('emailInput').value.trim() : '',
                    isGuest: false
                };
                localStorage.setItem('ramz_user', JSON.stringify(sessionUser));

                toast('✅ تم التسجيل بنجاح');
                setTimeout(() => {
                    window.location.href = 'chats.html';
                }, 500);

            } catch (error) {
                console.error('فشل التسجيل:', error);
                toast('❌ فشل التسجيل: ' + (error.message || 'خطأ غير معروف'));
                btn.disabled = false;
                btn.textContent = '🚀 تسجيل الدخول';
            }
        });

        // ========== الدخول كضيف ==========
        document.getElementById('guestBtn').addEventListener('click', () => {
            const guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const guestName = 'زائر_' + guestId.slice(-4);

            const sessionUser = {
                id: guestId,
                name: guestName,
                avatar: '👤',
                phone: '',
                email: '',
                isGuest: true
            };
            localStorage.setItem('ramz_user', JSON.stringify(sessionUser));
            toast('👋 مرحباً بك كضيف');
            setTimeout(() => {
                window.location.href = 'chats.html';
            }, 300);
        });

        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
