<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>⚡ RamzApp | الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --surface2: #222;
            --text: #fff;
            --text3: #999;
            --border: #2c2c2c;
            --accent: #ff0050;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .login-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 360px;
            background: var(--surface2);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
        }
        .login-box h2 { font-size: 2rem; margin-bottom: 5px; }
        .login-input {
            padding: 15px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: #0d0d0d;
            color: var(--text);
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .login-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255,0,80,0.1);
        }
        .btn {
            padding: 15px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #ff6b8a);
            color: #fff;
            font-family: inherit;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,0,80,0.4); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
        }
        .toast.show { opacity: 1; }
        .hidden { display: none !important; }
        .guest-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 5px;
        }
        .link {
            color: var(--accent);
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ RamzApp</h2>

        <!-- شاشة الاختيار الأولى -->
        <div id="startScreen">
            <p style="color:var(--text3); margin-bottom:10px;">تطبيق المراسلة الآمن</p>
            <button class="btn" id="showLoginBtn">🔑 تسجيل الدخول</button>
            <button class="btn btn-outline" id="showSignupBtn">🆕 إنشاء حساب جديد</button>
            <div class="guest-row">
                <button class="btn btn-outline" id="guestBtn" style="width:100%;">👤 الدخول كضيف</button>
            </div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <div id="loginScreen" class="hidden">
            <p style="color:var(--text3);">تسجيل الدخول بحسابك</p>
            <input type="email" class="login-input" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="email">
            <input type="password" class="login-input" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
            <button class="btn" id="loginSubmitBtn">🚀 دخول</button>
            <span class="link" id="switchToSignup">ليس لديك حساب؟ إنشاء حساب جديد</span>
        </div>

        <!-- نموذج إنشاء حساب جديد -->
        <div id="signupScreen" class="hidden">
            <p style="color:var(--text3);">إنشاء حساب جديد</p>
            <input type="email" class="login-input" id="signupEmail" placeholder="البريد الإلكتروني" autocomplete="email">
            <input type="password" class="login-input" id="signupPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password">
            <input type="text" class="login-input" id="signupName" placeholder="اسم المستخدم" autocomplete="off">
            <button class="btn" id="signupSubmitBtn">🚀 إنشاء حساب</button>
            <span class="link" id="switchToLogin">لديك حساب بالفعل؟ تسجيل الدخول</span>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://serlegwdzjulfcxabxzv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4_c97KxnG_7HTvfv-pKeNQ_FTlnK6Yx';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // ========== دوال المساعدة ==========
        function toast(msg, dur = 2000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), dur);
        }

        function saveAndGo(user) {
            localStorage.setItem('ramz_user', JSON.stringify(user));
            window.location.href = 'chats.html';
        }

        // ========== عناصر الواجهة ==========
        const startScreen = document.getElementById('startScreen');
        const loginScreen = document.getElementById('loginScreen');
        const signupScreen = document.getElementById('signupScreen');

        // أزرار الانتقال بين الشاشات
        document.getElementById('showLoginBtn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        });
        document.getElementById('showSignupBtn').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            signupScreen.classList.remove('hidden');
        });
        document.getElementById('switchToSignup').addEventListener('click', () => {
            loginScreen.classList.add('hidden');
            signupScreen.classList.remove('hidden');
        });
        document.getElementById('switchToLogin').addEventListener('click', () => {
            signupScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
        });

        // ========== تسجيل الدخول ==========
        document.getElementById('loginSubmitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري الدخول...';

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!email || !password) {
                toast('⚠️ جميع الحقول مطلوبة');
                btn.disabled = false;
                btn.textContent = '🚀 دخول';
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // جلب الاسم من جدول profiles إن وجد
                let username = email.split('@')[0];
                const { data: profile } = await supabase.from('profiles').select('username').eq('id', data.user.id).single();
                if (profile && profile.username) username = profile.username;

                const sessionUser = {
                    id: data.user.id,
                    name: username,
                    avatar: username.charAt(0).toUpperCase(),
                    email: email,
                    phone: '',
                    isGuest: false
                };
                saveAndGo(sessionUser);
                toast('✅ تم تسجيل الدخول');
            } catch (error) {
                console.error('فشل الدخول:', error);
                toast('❌ ' + (error.message || 'بيانات الدخول غير صحيحة'));
                btn.disabled = false;
                btn.textContent = '🚀 دخول';
            }
        });

        // ========== إنشاء حساب جديد ==========
        document.getElementById('signupSubmitBtn').addEventListener('click', async () => {
            const btn = document.getElementById('signupSubmitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ جاري إنشاء الحساب...';

            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const name = document.getElementById('signupName').value.trim();

            if (!email || !password || !name) {
                toast('⚠️ جميع الحقول مطلوبة');
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء حساب';
                return;
            }
            if (password.length < 6) {
                toast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء حساب';
                return;
            }

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { username: name } }
                });
                if (error) throw error;

                // حفظ في جدول profiles
                await supabase.from('profiles').upsert({
                    id: data.user.id,
                    email,
                    username: name,
                    avatar: name.charAt(0).toUpperCase()
                });

                const sessionUser = {
                    id: data.user.id,
                    name: name,
                    avatar: name.charAt(0).toUpperCase(),
                    email: email,
                    phone: '',
                    isGuest: false
                };
                saveAndGo(sessionUser);
                toast('✅ تم إنشاء الحساب بنجاح');
            } catch (error) {
                console.error('فشل إنشاء الحساب:', error);
                toast('❌ ' + (error.message || 'حدث خطأ'));
                btn.disabled = false;
                btn.textContent = '🚀 إنشاء حساب';
            }
        });

        // ========== الدخول كضيف ==========
        document.getElementById('guestBtn').addEventListener('click', () => {
            const guestId = 'guest_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const guestName = 'زائر_' + guestId.slice(-4);
            const sessionUser = {
                id: guestId,
                name: guestName,
                avatar: '👤',
                email: '',
                phone: '',
                isGuest: true
            };
            saveAndGo(sessionUser);
            toast('👋 مرحباً بك كضيف');
        });
    </script>
</body>
</html>
