<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>⚡ RamzApp | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d; --surface2: #222; --text: #fff; --text3: #999; --border: #2c2c2c; --accent: #ff0050;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); font-family: 'Cairo', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center; color: var(--text);
        }
        .login-box {
            text-align: center; display: flex; flex-direction: column; gap: 20px; width: 360px;
            background: var(--surface2); padding: 30px 20px; border-radius: 20px; border: 1px solid var(--border);
        }
        .login-box h2 { font-size: 2rem; }
        .login-input {
            padding: 15px; border-radius: 30px; border: 2px solid var(--border); background: #0d0d0d;
            color: var(--text); font-family: inherit; font-size: 16px; text-align: center; outline: none;
        }
        .login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,0,80,0.1); }
        .phone-row { display: flex; gap: 8px; }
        .phone-row select {
            padding: 15px 10px; border-radius: 30px; border: 2px solid var(--border); background: #0d0d0d;
            color: var(--text); font-family: inherit; font-size: 16px; outline: none; width: 110px;
        }
        .phone-row input { flex: 1; }
        .btn {
            padding: 15px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, var(--accent), #ff6b8a); color: #fff;
            font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,0,80,0.4); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .guest-btn { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #333;
            color: #fff; padding: 10px 20px; border-radius: 25px; font-size: 14px; opacity: 0; transition: 0.3s;
        }
        .toast.show { opacity: 1; }
        .method-toggle { display: flex; gap: 8px; justify-content: center; }
        .method-btn {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent;
            color: var(--text3); cursor: pointer; font-family: inherit; font-size: 13px; transition: 0.2s;
        }
        .method-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ RamzApp</h2>
        <p style="color:var(--text3); font-size:14px;">اختر طريقة الدخول</p>

        <div class="method-toggle">
            <button class="method-btn active" id="phoneMethodBtn">📱 رقم الهاتف</button>
            <button class="method-btn" id="emailMethodBtn">📧 البريد الإلكتروني</button>
        </div>

        <div id="phoneFields">
            <div class="phone-row">
                <select id="countryCode">
                    <option value="+967" selected>🇾🇪 +967 اليمن</option>
                    <!-- باقي الدول كما هي -->
                </select>
                <input type="tel" class="login-input" id="phoneInput" placeholder="رقم الهاتف" autocomplete="off">
            </div>
        </div>

        <div id="emailFields" style="display:none;">
            <input type="email" class="login-input" id="emailInput" placeholder="البريد الإلكتروني" autocomplete="off">
            <input type="password" class="login-input" id="passwordInput" placeholder="كلمة المرور" autocomplete="off" style="margin-top:8px;">
        </div>

        <input type="text" class="login-input" id="nameInput" placeholder="اسم المستخدم" autocomplete="off">

        <button class="btn" id="loginBtn">🚀 تسجيل الدخول</button>
        <button class="btn guest-btn" id="guestBtn">👤 الدخول كضيف</button>
    </div>
    <div class="toast" id="toast"></div>

</body>
</html>
